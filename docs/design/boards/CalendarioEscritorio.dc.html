<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario en escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F2E8}a:hover{color:#F2B632}
</style>
</helmet>
<div style="min-height: 860px; display: flex; flex-wrap: wrap; background: #0F3440; color: #F2F2E8; font-family: Figtree, system-ui, sans-serif">
  <aside style="flex: 1 1 220px; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; background: #17444F">
    <p style="margin: 0; padding: 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">MiseEnPlace</p>
    <nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
      <a href="#calendario" aria-current="page" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 12px; background: #F2B632; color: #0F3440; font-size: 16px; font-weight: 600; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>
        Calendario
      </a>
      <a href="#inventario" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 12px; color: #F2F2E8; font-size: 16px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"></path></svg>
        Inventario
      </a>
      <a href="#compras" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 12px; color: #F2F2E8; font-size: 16px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 12h10L20 8H6.5M9 20h.01M16 20h.01"></path></svg>
        Compras
      </a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; border-top: 1px solid #62919B">
      <p style="margin: 0; font-size: 15px; font-weight: 500">Marta</p>
      <button type="button" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #C4D6D8; font: 500 15px Figtree, sans-serif">Cerrar sesión</button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Octubre 2026</h1>
      <button type="button" style="min-height: 48px; padding: 0 22px; border: 0; border-radius: 24px; background: #F2B632; color: #0F3440; font: 600 16px Figtree, sans-serif">Añadir comida</button>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" aria-label="Semana anterior" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #F2F2E8">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <p style="margin: 0; font-size: 16px; font-weight: 500; color: #C4D6D8">26 oct – 1 nov</p>
        <button type="button" aria-label="Semana siguiente" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #F2F2E8">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
        <button type="button" style="min-height: 44px; margin-left: 8px; padding: 0 16px; border: 1px solid #62919B; border-radius: 22px; background: transparent; color: #F2F2E8; font: 600 15px Figtree, sans-serif">Hoy</button>
      </div>
      <div style="display: flex; padding: 2px; border-radius: 22px; background: #17444F">
        <button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #F2F2E8; color: #0F3440; font: 600 15px Figtree, sans-serif">Semana</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: transparent; color: #F2F2E8; font: 500 15px Figtree, sans-serif">Mes</button>
      </div>
    </div>

    <div style="flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(128px, 100%), 1fr)); gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <section style="min-height: 560px; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: {{d.border}}; border-radius: 16px">
          <h2 style="margin: 0; padding: 4px 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 4px; font-size: 14px; font-weight: 500; color: {{d.labelColor}}">
            {{d.name}}
            <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 800; color: {{d.numberColor}}">{{d.number}}</span>
          </h2>
          <sc-for list="{{d.meals}}" as="m" hint-placeholder-count="3">
            <article style="padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; border-radius: 12px; background: #17444F">
              <span style="padding: 2px 7px; border-radius: 8px; background: {{m.color}}; color: #0F3440; font-size: 12px; font-weight: 600">{{m.type}}</span>
              <h3 style="margin: 0; font-size: 15px; line-height: 1.25; font-weight: 600">{{m.name}}</h3>
              <p style="margin: 0; font-size: 13px; color: #C4D6D8">{{m.person}}</p>
            </article>
          </sc-for>
          <button type="button" aria-label="{{d.addLabel}}" style="min-height: 44px; margin-top: auto; border: 1px dashed #62919B; border-radius: 12px; background: transparent; color: #F2F2E8; font: 600 14px Figtree, sans-serif">Añadir</button>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { Desayuno: '#F2B632', Comida: '#F2AE93', Cena: '#A5D0E6', Merienda: '#BFE3B4', Snack: '#E2BBD6' };
    const meal = (type, name, person) => ({ type, name, person, color: colors[type] });
    const week = [
      ['Lun', 26, [meal('Comida', 'Crema de calabaza', 'Luis'), meal('Cena', 'Sopa de fideos', 'Ana')]],
      ['Mar', 27, [meal('Comida', 'Arroz con verduras', 'Pablo')]],
      ['Mié', 28, [meal('Comida', 'Pollo al horno', 'Ana'), meal('Cena', 'Ensalada templada', 'Luis')]],
      ['Jue', 29, [meal('Cena', 'Merluza a la plancha', 'Marta')]],
      ['Vie', 30, [
        meal('Desayuno', 'Tostadas con tomate', 'Luis'),
        meal('Comida', 'Lentejas estofadas', 'Ana'),
        meal('Merienda', 'Fruta de temporada', 'Sin asignar'),
        meal('Cena', 'Tortilla de patatas', 'Marta'),
      ]],
      ['Sáb', 31, [meal('Comida', 'Paella', 'Ana')]],
      ['Dom', 1, []],
    ];
    return {
      days: week.map(([name, number, meals]) => {
        const today = number === 30;
        return {
          name, number, meals,
          addLabel: 'Añadir comida el ' + name + ' ' + number,
          border: today ? '2px solid #F2B632' : '1px solid #62919B',
          labelColor: today ? '#F2B632' : '#C4D6D8',
          numberColor: today ? '#F2B632' : '#F2F2E8',
        };
      }),
    };
  }
}
</script>
</body>
</html>
