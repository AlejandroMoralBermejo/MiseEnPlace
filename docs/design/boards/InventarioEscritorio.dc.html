<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inventario en escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F2E8}a:hover{color:#F2B632}
</style>
</helmet>
<div style="min-height: 860px; display: flex; flex-wrap: wrap; background: #0F3440; color: #F2F2E8; font-family: Figtree, system-ui, sans-serif">
  <aside style="flex: 1 1 220px; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; background: #17444F">
    <p style="margin: 0; padding: 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">MiseEnPlace</p>
    <nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
      <a href="#calendario" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 12px; color: #F2F2E8; font-size: 16px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>
        Calendario
      </a>
      <a href="#inventario" aria-current="page" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 12px; background: #F2B632; color: #0F3440; font-size: 16px; font-weight: 600; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"></path></svg>
        Inventario
      </a>
      <a href="#compras" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 12px; color: #F2F2E8; font-size: 16px; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 12h10L20 8H6.5M9 20h.01M16 20h.01"></path></svg>
        Compras
      </a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; border-top: 1px solid #62919B">
      <p style="margin: 0; font-size: 15px; font-weight: 500">Marta</p>
      <button type="button" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #C4D6D8; font: 500 15px Figtree, sans-serif">Cerrar sesión</button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Inventario</h1>
      <button type="button" style="min-height: 48px; padding: 0 22px; border: 0; border-radius: 24px; background: #F2B632; color: #0F3440; font: 600 16px Figtree, sans-serif">Añadir ingrediente</button>
    </header>

    <div style="max-width: 420px; display: flex; flex-direction: column; gap: 4px">
      <label for="buscar" style="font-size: 14px; font-weight: 600">Buscar ingrediente</label>
      <input id="buscar" type="search" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #62919B; border-radius: 12px; background: #17444F; color: #F2F2E8; font: 500 16px Figtree, sans-serif">
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); column-gap: 32px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="9">
        <div style="min-height: 56px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #62919B">
          <a href="#editar" style="flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #F2F2E8; text-decoration: none">
            <span style="min-width: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.name}}</span>
            <span style="flex: none; font-size: 16px; font-weight: 600; color: {{i.amountColor}}">{{i.amount}}</span>
          </a>
          <button type="button" aria-label="{{i.deleteLabel}}" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #FFB3A8">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const stock = [
      ['Aceite de oliva', 1, 'litros'], ['Arroz', 2, 'kg'], ['Harina', 1, 'kg'], ['Huevos', 12, 'unidades'],
      ['Leche', 6, 'litros'], ['Lentejas', 500, 'g'], ['Pasta', 0, 'paquetes'], ['Sal', 1, 'kg'], ['Tomate frito', 3, 'latas'],
    ];
    return {
      items: stock.map(([name, quantity, unit]) => ({
        name,
        amount: quantity === 0 ? 'Agotado' : quantity + ' ' + unit,
        amountColor: quantity === 0 ? '#FFB3A8' : '#F2F2E8',
        deleteLabel: 'Eliminar ' + name,
      })),
    };
  }
}
</script>
</body>
</html>
